<!doctype html>
<html lang="ru">
<head><meta charset="utf-8">
<style>
  :root{color-scheme:light dark}
  body{font:13px/1.5 Inter,system-ui,sans-serif;margin:0;padding:16px}
  h1{font-size:14px;margin:0 0 4px}
  p{margin:0 0 12px;opacity:.7}
  input{display:block;margin-bottom:8px}
  textarea{display:block;width:100%;box-sizing:border-box;height:56px;
    font:12px/1.4 ui-monospace,Menlo,monospace;resize:vertical;
    border:1px solid rgba(128,128,128,.45);border-radius:4px;padding:6px}
  .or{margin:8px 0 6px;opacity:.55;font-size:12px}
  .row{display:flex;gap:6px;padding:4px 0;border-top:1px solid rgba(128,128,128,.25)}
  .lvl{flex:0 0 64px;font-weight:600}
  .error{color:#dc2626}.warning{color:#d97706}.info{opacity:.7}
  #out{max-height:180px;overflow:auto}
  .check{margin-top:12px;padding:8px;border:1px solid #d97706;border-radius:4px}
</style></head>
<body>
  <h1>webpage2figma</h1>
  <p>Выбери файл <code>.w2f</code>, собранный расширением.</p>
  <input type="file" id="file" accept=".w2f,application/zip">

  <p class="or">…или вставь сюда то, что скопировала кнопка
     «Скопировать для Figma» — файл тогда не нужен.</p>
  <textarea id="paste" placeholder="w2f1:… (Ctrl+V / ⌘V)"></textarea>

  <div id="out"></div>
<script>
  const out = document.getElementById('out')
  document.getElementById('file').addEventListener('change', async (event) => {
    const file = event.target.files && event.target.files[0]
    if (!file) return
    out.textContent = 'Читаю…'
    const bytes = new Uint8Array(await file.arrayBuffer())
    // Массив, а не Uint8Array: границу плагина переживает только то,
    // что сериализуется как JSON.
    parent.postMessage({ pluginMessage: { kind: 'bundle', bytes: Array.from(bytes) } }, '*')
  })

  // Разбор строки здесь НЕ делается: она уходит в код плагина целиком.
  // Окно намеренно глупое — декодер в нём стал бы вторым экземпляром
  // той же логики, а второй экземпляр расходится с первым молча.
  const paste = document.getElementById('paste')
  const send = (text) => {
    if (!text || !text.trim()) return
    out.textContent = 'Читаю…'
    parent.postMessage(
      { pluginMessage: { kind: 'bundle-text', text: text } }, '*')
    // Поле очищается СРАЗУ: строка длиной в мегабайты, оставленная в
    // textarea, заметно тормозит окно при каждой перерисовке отчёта.
    paste.value = ''
  }

  // Слушается именно `paste`, а не `change`: вставка обязана сработать
  // от самого Ctrl+V, без ухода фокуса. Значение в событии приходит
  // раньше, чем попадает в поле, поэтому берётся из буфера события.
  paste.addEventListener('paste', (event) => {
    const text = event.clipboardData && event.clipboardData.getData('text')
    if (!text) return
    event.preventDefault()
    send(text)
  })
  // Запасной путь: перетаскивание текста или ручной ввод. Без него
  // поле, заполненное не вставкой, молча ничего бы не делало.
  paste.addEventListener('change', () => send(paste.value))

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage
    if (!msg) return
    if (msg.kind === 'error') {
      out.innerHTML = '<div class="row error">' + escapeHtml(msg.text) + '</div>'
      return
    }
    // Переносы узлов сворачиваются в одну строку: это не изъяны, а
    // объяснение, почему слой лежит не там, где элемент в разметке. На
    // живой странице их под сотню, и списком они топят всё остальное.
    const hoisted = msg.report.filter(
      (entry) => entry.code === 'fidelity.paint-order-hoisted').length
    const hoistedRow = hoisted === 0 ? '' :
      '<div class="row info">' + hoisted + ' узлов перенесено к предкам ради ' +
      'верного порядка отрисовки — в Figma порядок слоёв и есть z-порядок.' +
      '</div>'
    const rest = msg.report.filter(
      (entry) => entry.code !== 'fidelity.paint-order-hoisted')
    const rows = rest.map((entry) =>
      '<div class="row"><span class="lvl ' + entry.level + '">' + entry.level +
      '</span><span>' + escapeHtml(entry.message) + '</span></div>').join('')
    const check = msg.needsVerification.length === 0 ? '' :
      '<div class="check"><b>Требует сверки глазами</b> — здесь наша модель ' +
      'поведения Figma остаётся догадкой:<br>' +
      msg.needsVerification.map((v) => escapeHtml(v.message)).join('<br>') + '</div>'
    out.innerHTML =
      '<div class="row"><b>Экранов создано: ' + msg.screens + '</b></div>' +
      hoistedRow +
      (rows || '<div class="row info">Расхождений не найдено.</div>') + check
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"]/g, (ch) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]))
  }
</script>
</body></html>
