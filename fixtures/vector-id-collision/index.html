<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>vector-id-collision</title>
<style>*{margin:0;padding:0}body{background:#fff}.row{display:flex;gap:24px;padding:24px}</style>
</head>
<body>
  <!-- ПАТОЛОГИЯ САМОЙ СТРАНИЦЫ, и она здесь нарочно.
       Два градиента с одинаковым id в одном документе. Браузер
       разрешает url(#g) в ПЕРВЫЙ по порядку документа и красит обе
       плитки оранжевым — зелёный не рисуется нигде, хотя написан.

       Пиксельно сверять это нельзя: захват делает каждый SVG
       самодостаточным и рисует написанное, то есть вторую плитку
       зелёной. Расхождение измерено — 2354 пикселя. Поднимать под него
       порог значило бы требовать от нас воспроизводить баг страницы.
       Поэтому фикстура живёт в проверке ДИАГНОСТИК: утверждается, что
       захват такое называет, а не расходится молча. -->
  <div class="row">
    <svg width="64" height="64" viewBox="0 0 24 24">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f59e0b"/>
        <stop offset="1" stop-color="#b45309"/>
      </linearGradient></defs>
      <rect x="2" y="2" width="20" height="20" rx="4" fill="url(#g)"/>
    </svg>
    <svg width="64" height="64" viewBox="0 0 24 24">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#22c55e"/>
        <stop offset="1" stop-color="#065f46"/>
      </linearGradient></defs>
      <rect x="2" y="2" width="20" height="20" rx="4" fill="url(#g)"/>
    </svg>
  </div>
</body></html>
