<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>naming</title>
<style>*{margin:0;padding:0}body{background:#fff;font:14px monospace;padding:8px}
  div,section,nav{padding:4px}</style></head>
<body>
  <!-- Имя слоя — единственное, по чему его находят в панели Figma.
       Здесь собраны все правила выбора имени, по убыванию надёжности. -->

  <!-- Написанное для людей важнее всего: автор сам объяснил, что это. -->
  <div aria-label="Главное меню"><span>x</span></div>
  <div title="Подсказка к блоку"><span>y</span></div>
  <img src="/image-fit/asset.png" alt="Логотип компании" width="40" height="30">

  <!-- Без подписи у картинки берётся имя файла: «asset» говорит
       больше, чем «img». -->
  <img src="/image-fit/asset.png" width="40" height="30">

  <!-- Собственный текст — раньше семантики тега: «Войти» полезнее,
       чем «button». -->
  <button>Войти</button>

  <!-- Семантический тег, когда текста нет. -->
  <nav><span>·</span></nav>
  <section><span>·</span></section>

  <!-- Короткая надпись ВНУТРИ: обёрнутый текст встречается чаще
       прямого. -->
  <div><span>Купить билет</span></div>

  <!-- Длинный текст в имя не идёт: он не поместится в панель, и узел
       остаётся под своим тегом. -->
  <div><span>Очень длинная надпись, которая заведомо не помещается в
    имя слоя и потому не должна в него попадать вовсе</span></div>

  <!-- Классы не используются вовсе: в нынешней вёрстке это описание
       стиля, а не смысла. -->
  <div class="flex items-center gap-2 rounded-xl"></div>
</body></html>
