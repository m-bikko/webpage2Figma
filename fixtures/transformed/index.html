<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>transformed</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fff;font-family:Arial,sans-serif;padding:40px}
  .row{display:flex;gap:40px}
  .b{width:120px;height:60px;background:#3b82f6}
  .rot{transform:rotate(15deg)}
  .scl{transform:scale(1.5)}
  .tr{transform:translate(20px,10px)}
  /* НЕравномерный масштаб вместе с поворотом. Единственный блок, на
     котором виден ПОРЯДОК множителей в рендерере: при равномерном
     масштабе rotate и scale коммутируют, и перестановка невидима. */
  .rs{transform:rotate(20deg) scale(1.6,0.7)}
</style></head>
<body><div class="row">
  <div class="b rot"></div><div class="b scl"></div><div class="b tr"></div><div class="b rs"></div>
</div></body></html>
