<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>gradient</title>
<style>
  *{margin:0;padding:0}
  body{background:#fff}
  .hero{height:160px;background:linear-gradient(135deg,#6366f1,#ec4899)}
  .vertical{height:80px;background:linear-gradient(#22c55e,#0f766e)}
  .horizontal{height:80px;background:linear-gradient(to right,#f59e0b,#b45309)}
  /* Неквадратный бокс с угловым ключевым словом — здесь ловится
     перепутанный atan2, невидимый на квадрате. */
  .corner{height:100px;background:linear-gradient(to top right,#0ea5e9,#312e81)}
  .stops{height:80px;
    background:linear-gradient(to right,#ef4444 0%,#fbbf24 30%,#22c55e 100%)}
  /* Цвет И полупрозрачный градиент на одном узле. Раздельные свойства, а не
     сокращение background: оно сбрасывает цвет. Браузер смешивает слои;
     рендерер, отбрасывавший цвет, давал здесь 30% расхождения, и ни одна
     фикстура этого не видела. */
  .layered{height:100px;background-color:#1d4ed8;
    background-image:linear-gradient(to right,rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.85) 100%)}
</style></head>
<body>
  <div class="hero"></div><div class="vertical"></div>
  <div class="horizontal"></div><div class="corner"></div><div class="stops"></div><div class="layered"></div>
</body></html>
