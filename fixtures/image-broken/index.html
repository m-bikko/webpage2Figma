<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>image-broken</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fff;padding:24px}
  /* Подложка непрозрачна намеренно: дыра на белом фоне неотличима от
     белого, и фикстура не различала бы заглушку и пропажу. */
  .row{display:flex;gap:16px}
  img{width:120px;height:90px;background:#d4d4d8}
</style></head>
<body>
  <div class="row">
    <!-- Файла нет: 404 от сервера фикстур. -->
    <img src="нет-такого.png" alt="404">
    <!-- Порт, на котором заведомо никто не слушает: сетевой отказ,
         а не 404 — это другой путь, и он тоже обязан быть выполним. -->
    <img src="http://127.0.0.1:1/x.png" alt="сеть">
  </div>
</body></html>
