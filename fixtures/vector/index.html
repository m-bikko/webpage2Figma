<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>vector</title>
<style>
  *{margin:0;padding:0}
  body{background:#fff;font:16px/1.5 monospace}
  .row{display:flex;gap:24px;padding:24px;align-items:center}
  /* Цвет иконки задан ТЕКСТОВЫМ цветом, а в разметке стоит
     currentColor. Иконка, вырванная из страницы без вписывания
     вычисленных стилей, приедет чёрной — и это самый частый способ
     потерять иконку так, что потеря выглядит как замысел. */
  .tinted{color:#2563eb}
  .tinted-warm{color:#dc2626}
  /* Толщина обводки — из CSS-правила, не из атрибута. Второй способ
     потерять вид: класс остаётся в разметке, а таблицы стилей рядом
     уже нет. */
  .thin path{stroke-width:1}
  .fat path{stroke-width:4}
  .scaled{width:96px;height:96px}
  .box{border:2px solid #0f172a;background:#f1f5f9;padding:8px}
</style></head>
<body>
  <div class="row">
    <!-- Два разных цвета через currentColor. -->
    <svg class="tinted" width="48" height="48" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M4 12 L10 18 L20 6"/>
    </svg>
    <svg class="tinted-warm" width="48" height="48" viewBox="0 0 24 24"
         fill="currentColor">
      <circle cx="12" cy="12" r="9"/>
    </svg>
    <!-- Обводка из CSS-правила, а не из атрибута. -->
    <svg class="thin" width="48" height="48" viewBox="0 0 24 24" fill="none"
         stroke="#0f766e"><path d="M3 21 L12 3 L21 21 Z"/></svg>
    <svg class="fat" width="48" height="48" viewBox="0 0 24 24" fill="none"
         stroke="#0f766e"><path d="M3 21 L12 3 L21 21 Z"/></svg>
  </div>

  <div class="row">
    <!-- Идентификаторы здесь РАЗНЫЕ, и это не упущение. Одинаковые
         столкнулись бы в самой странице: браузер разрешает url(#g) в
         первый по порядку документа и красит обе плитки одинаково.
         Требовать от захвата воспроизводить эту патологию неверно —
         она проверяется отдельной фикстурой `vector-id-collision/`,
         где утверждается диагностика, а не пиксели.

         Разведение идентификаторов по пространствам имён проверяется
         там же, на `vector-id-collision/`: здесь оно не видно, потому
         что видеть нечего. -->
    <svg width="64" height="64" viewBox="0 0 24 24">
      <defs><linearGradient id="g-warm" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f59e0b"/>
        <stop offset="1" stop-color="#b45309"/>
      </linearGradient></defs>
      <rect x="2" y="2" width="20" height="20" rx="4" fill="url(#g-warm)"/>
    </svg>
    <svg width="64" height="64" viewBox="0 0 24 24">
      <defs><linearGradient id="g-cool" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#22c55e"/>
        <stop offset="1" stop-color="#065f46"/>
      </linearGradient></defs>
      <rect x="2" y="2" width="20" height="20" rx="4" fill="url(#g-cool)"/>
    </svg>
    <!-- viewBox не совпадает с боксом: содержимое обязано
         отмасштабироваться, а не обрезаться. -->
    <svg class="scaled" viewBox="0 0 24 24" fill="#7c3aed">
      <polygon points="12,2 22,22 2,22"/>
    </svg>
  </div>

  <!-- Спрайт: разметка лежит в скрытом SVG, а на местах стоят ссылки.
       Скопировать только внешний элемент значит получить пустоту —
       и пустота эта выглядит как «иконки просто нет». -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="icon-star" viewBox="0 0 24 24">
        <path d="M12 2 L15 9 L22 9 L16.5 13.5 L18.5 21 L12 16.5 L5.5 21
                 L7.5 13.5 L2 9 L9 9 Z" fill="#eab308"/>
      </symbol>
      <symbol id="icon-heart" viewBox="0 0 24 24">
        <path d="M12 21 C 4 14 2 10 5 7 C 8 4 12 8 12 8 C 12 8 16 4 19 7
                 C 22 10 20 14 12 21 Z" fill="#e11d48"/>
      </symbol>
    </defs>
  </svg>
  <div class="row">
    <svg width="48" height="48"><use href="#icon-star"/></svg>
    <svg width="48" height="48"><use href="#icon-heart"/></svg>
    <!-- Вектор внутри бокса с собственным фоном и рамкой: проверяет,
         что фон узла рисуется и не затирает вектор. -->
    <span class="box">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="#0f172a">
        <rect x="4" y="4" width="16" height="16"/>
      </svg>
    </span>
  </div>
</body></html>
