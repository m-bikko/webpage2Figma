<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>image-slow</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fff;padding:24px}
  /* Подложка непрозрачна: на белом потерю не отличить от пустоты. */
  img{width:120px;height:90px;background:#d4d4d8;object-fit:contain}
</style></head>
<body>
  <!-- Картинка приходит с задержкой. Это воспроизводит обычное для
       живых страниц положение: в момент съёмки она ещё не загружена,
       naturalWidth нулевой, и узел становится заглушкой. На захвате
       настоящей страницы так потерялись восемь картинок. -->
  <img src="/image-fit/asset.png?delay=2000" alt="медленная">
</body></html>
